<puibe-expansion-panel
    [heading]="heading"
    [addItemPadding]="false"
    [headingLevel]="2"
    [variant]="'white'"
    [isExpanded]="true"
    class="relative overflow-hidden"
>
    @if (navigationHeadings?.length > 0) {
        <div role="separator" class="mx-5 mb-5 block h-px bg-gray"></div>
    }
    <nav class="pb-5" role="navigation" [attr.aria-label]="heading">
        <div
            #movingBar
            class="absolute left-0 w-[6px] bg-red transition-all duration-300 ease-[cubic-bezier(0.38,-0.38,0.5,1.28)]"
        ></div>
        <ul class="list-none">
            @for (navHeading of navigationHeadings; track navHeading; let i = $index) {
                <li [attr.aria-selected]="activeIndex === i">
                    <a
                        #navHeading
                        class="block p-4 pl-6 text-h5 font-light no-underline transition-colors duration-150 ease-in-out hover:text-black"
                        [ngClass]="{
                            'bg-light-sand text-red hover:text-red': activeIndex === i,
                            '[&:hover>span]:text-red': activeIndex !== i,
                        }"
                        (click)="onHeadingClick(i, $event)"
                    >
                        <span class="inline-block transition-colors select-none">{{ navHeading }}</span>
                    </a>
                </li>
            }
        </ul>
    </nav>
</puibe-expansion-panel>
