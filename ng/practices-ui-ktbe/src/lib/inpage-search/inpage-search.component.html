<div class="block bg-sand p-4">
    <div class="relative" aria-hidden="true">
        @if (!pending) {
            <puibe-icon-search class="absolute right-0 block h-10 w-10 p-0.5"></puibe-icon-search>
        }
        @if (pending) {
            <puibe-icon-spinner class="absolute right-0 block h-10 w-10 p-2"></puibe-icon-spinner>
        }
    </div>
    <input
        [attr.aria-label]="label ?? ('Practices.Labels_Search' | translate)"
        class="h-10 w-full bg-white pr-ktbe-15 pl-6 text-black placeholder:text-dark-gray placeholder-shown:text-dark-gray"
        type="text"
        [placeholder]="placeholder ?? ('Practices.Labels_Search' | translate)"
        [ngModel]="searchTerm$ | async"
        (ngModelChange)="onSearchTermChange($event)"
    />
</div>
