<a [routerLink]="link" class="no-underline hover:text-black">
    @if (image) {
        <img [src]="image" [alt]="alt" class="w-[150px]" />
    }
    @if (!image) {
        <puibe-icon-ktbe-logo class="block w-[150px]" [title]="alt"></puibe-icon-ktbe-logo>
    }
    @if (caption) {
        <span
            class="mt-[25px] block max-w-52 text-extra-small leading-3 font-normal break-words text-ellipsis lg:max-w-80 lg:text-logo-caption lg:leading-ktbe-logo-caption"
            >{{ caption }}<ng-content select="[caption]"></ng-content
        ></span>
    }
</a>
<ng-content></ng-content>
