<div
    class="flex flex-auto items-center justify-center rounded-full leading-loose transition duration-100 ease-in-out max-sm:text-h6 max-sm:leading-ktbe-h6"
    [ngClass]="{
        'bg-red text-white hover:bg-red-hover': selected === true,
        'hover:bg-dark-sand': selected === false,
        'font-light text-dark-gray hover:text-black contrast-more:text-anthrazit-solid': isOtherPeriod,
        'border border-cappuchino': today,
        'cursor-not-allowed font-light text-dark-gray-50 hover:bg-transparent hover:text-dark-gray-50': disabled,
        'bg-gray': selected === true && disabled,
        'cursor-pointer': !disabled,
    }"
    [title]="label"
    role="button"
    [attr.tabindex]="isFocusable() ? '0' : '-1'"
    [ariaSelected]="selected"
    [ariaLabel]="label"
    [ariaHidden]="!selected && !focused"
    [ariaDisabled]="disabled"
    [attr.data-selected-date]="selected"
    [attr.data-focused-date]="focused"
>
    <span aria-hidden="true">{{ labelShort }}</span>
    <span class="sr-only">{{ label }}</span>
</div>
