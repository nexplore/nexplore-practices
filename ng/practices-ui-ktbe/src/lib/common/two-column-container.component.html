<div class="flex flex-wrap justify-between">
    <div
        #left
        class="basis-full"
        [ngClass]="
            $safeNavigationMigration(_mobileOrderMap[mobileOrder]?.left) +
            ' ' +
            $safeNavigationMigration(_horizontalDistributionMap[horizontalDistribution]?.left)
        "
    >
        <ng-content select="[left-column]"></ng-content>
    </div>
    <div
        #right
        class="basis-full"
        [ngClass]="
            $safeNavigationMigration(_mobileOrderMap[mobileOrder]?.right) +
            ' ' +
            $safeNavigationMigration(_horizontalDistributionMap[horizontalDistribution]?.right)
        "
    >
        <ng-content select="[right-column]"></ng-content>
        <div></div>
    </div>
</div>
