<div
    class="flex min-h-[5.3125rem] flex-row items-stretch justify-stretch"
    [ngClass]="{ 'opacity-50': inactive, 'opacity-100': !inactive }"
>
    <div class="flex items-center justify-center bg-cappuchino">
        <span class="min-w-[5.3125rem] self-start px-4 pt-[0.375rem] text-center text-very-large font-medium">{{
            step
        }}</span>
    </div>
    <div class="flex items-center justify-center bg-sand break-words whitespace-break-spaces">
        <span class="m-[1.25rem] text-h6 font-light md:m-[1.5625rem] md:text-h4">{{ text }}</span>
    </div>
</div>
