name: "label-sync"

on:
  push:
    branches: ["main"]
    paths:
      - ".github/labels.yml"
      - ".github/workflows/label-sync.yaml"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  sync:
    name: Sync labels
    runs-on: ubuntu-slim
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      - name: Sync labels
        uses: crazy-max/ghaction-github-labeler@v6.0.0
        with:
          yaml-file: .github/labels.yml
          skip-delete: true
          dry-run: false
