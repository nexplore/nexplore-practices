name: Publish

on:
  push:
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tag-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ./.github/workflows/build.template.yml

  publish:
    needs: build
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish.template.yml
    with:
      environment: "Nexplore Package Repository"
