name: Publish Template

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment name
        type: string
        required: true

jobs:
  publish:
    name: Publish ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      # Prepare .NET (global.json + explicit 8.x)
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@v5.4.0
        with:
          global-json-file: dotnet/global.json

      - name: Setup .NET 8.x
        uses: actions/setup-dotnet@v5.4.0
        with:
          dotnet-version: "8.x"

      # Prepare Node.js
      - name: Setup Node 22.14.0
        uses: actions/setup-node@v6.4.0
        with:
          node-version-file: "ng/.nvmrc"
          check-latest: true

      # Download the build artifact named 'build-output' from the prior job
      - name: Download build artifact
        uses: actions/download-artifact@v8.0.1
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output

      - name: Make build.sh executable
        run: chmod +x ./build.sh

      - name: Run Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./build.sh PublishAll --publish-artifacts-directory "${{ runner.temp }}/build-output"
