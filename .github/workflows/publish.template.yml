name: Publish Template

on:
  workflow_call:
    inputs:
      environment:
        description: Target environment name
        type: string
        required: true

jobs:
  publish:
    name: Publish ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          fetch-tags: true

      # Prepare .NET (global.json + explicit 8.x)
      - name: Setup .NET from global.json
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          global-json-file: dotnet/global.json

      - name: Setup .NET 8.x
        uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5.4.0
        with:
          dotnet-version: "8.x"

      # Prepare Node.js
      - name: Setup Node 22.14.0
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "22.14.0"
          check-latest: true

      # Download the build artifact named 'build-output' from the prior job
      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: build-output
          path: ${{ runner.temp }}/build-output

      - name: Make build.sh executable
        run: chmod +x ./build.sh

      - name: Run Publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./build.sh PublishAll --publish-artifacts-directory "${{ runner.temp }}/build-output"
